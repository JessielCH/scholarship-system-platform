name: QA Gate & Jira Validation

on:
  pull_request:
    branches:
      - qa

jobs:
  validate-pr:
    name: Validate PR Format & Requirements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Validate PR Title (Conventional Commits + Jira ID)
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $TITLE"
          if [[ ! $TITLE =~ ^(feat|fix|chore|docs|test|refactor|ci)\([a-zA-Z0-9_-]+\):\ \[SS-[0-9]+\]\ .+ ]]; then
            echo "❌ PR Title must follow the format: type(domain): [SS-XX] Description."
            exit 1
          fi
          echo "✅ PR Title format is correct."

      - name: Validate Microservice Requirements (Dockerfile & Tests)
        run: |
          # Detect modified microservices in this PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          echo "Changed files: $CHANGED_FILES"
          
          # Extract folders in apps/ or libs/ that have changed
          CHANGED_SERVICES=$(echo "$CHANGED_FILES" | grep -E '^(apps|libs)/' | cut -d '/' -f 1-2 | sort -u || true)
          
          if [ -z "$CHANGED_SERVICES" ]; then
            echo "⚠️ No microservices modified. Skipping deep validation."
            exit 0
          fi
          
          for SERVICE in $CHANGED_SERVICES; do
            echo "🔍 Validating requirements for: $SERVICE"
            
            # Validate Dockerfile
            if [ ! -f "$SERVICE/Dockerfile" ]; then
              echo "❌ Failed Requirement: Service $SERVICE does NOT have a Dockerfile."
              exit 1
            fi
            
            # Validate existence of tests directory or test files (basic check)
            if ! find "$SERVICE" -type f -name "*test*" -o -name "*spec*" | grep -q .; then
              echo "❌ Failed Requirement: Service $SERVICE does NOT contain tests (unit or functional tests)."
              exit 1
            fi
            
            echo "✅ Service $SERVICE complies with Dockerfile and Testing structure."
          done
          
      - name: Validate DB/Persistence Check Warning
        run: |
          echo "ℹ️ Remember to verify that the Microservice uses the stipulated database in Architecture.md and respects SOLID principles."
