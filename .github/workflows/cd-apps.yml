name: CD Microservices (Docker & Testing)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: ["QA", "staging", "main"]

jobs:
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    environment: qa
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'QA') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'QA')
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Get EC2 Instance IPs (QA)
        id: ec2-ips
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}" >> $GITHUB_ENV
          
          EDGE_IP=$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=qa-edge' 'Name=instance-state-name,Values=running' --query 'Reservations[*].Instances[*].PublicIpAddress' --output text)
          echo "Discovered Edge IP: $EDGE_IP"
          echo "EDGE_DYNAMIC_IP=$EDGE_IP" >> $GITHUB_ENV
          
          # Fetch IPs dynamically by Tag Name
          echo "DATABASE_PRIVATE_IP=$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=qa-database' 'Name=instance-state-name,Values=running' --query 'Reservations[*].Instances[*].PrivateIpAddress' --output text)" >> $GITHUB_ENV
          echo "BROKER_PRIVATE_IP=$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=qa-broker' 'Name=instance-state-name,Values=running' --query 'Reservations[*].Instances[*].PrivateIpAddress' --output text)" >> $GITHUB_ENV
          echo "CORE_PRIVATE_IP=$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=qa-core' 'Name=instance-state-name,Values=running' --query 'Reservations[*].Instances[*].PrivateIpAddress' --output text)" >> $GITHUB_ENV
          echo "COMPUTE_PRIVATE_IP=$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=qa-compute' 'Name=instance-state-name,Values=running' --query 'Reservations[*].Instances[*].PrivateIpAddress' --output text)" >> $GITHUB_ENV
          echo "SECURITY_PRIVATE_IP=$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=qa-security' 'Name=instance-state-name,Values=running' --query 'Reservations[*].Instances[*].PrivateIpAddress' --output text)" >> $GITHUB_ENV
          echo "INTELLIGENCE_PRIVATE_IP=$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=qa-intelligence' 'Name=instance-state-name,Values=running' --query 'Reservations[*].Instances[*].PrivateIpAddress' --output text)" >> $GITHUB_ENV
          
      - name: Copy docker-compose files (Native SCP)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "Setting up SSH Key..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          echo "Creating target directory on remote..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ubuntu@${{ env.EDGE_DYNAMIC_IP }} "mkdir -p /home/ubuntu/deployment"
          
          echo "Copying files via SCP..."
          scp -v -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa -r deployment/compose/ scripts/ ubuntu@${{ env.EDGE_DYNAMIC_IP }}:/home/ubuntu/deployment/
          
      - name: Deploy to Distributed EC2s
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DATABASE_PRIVATE_IP: ${{ env.DATABASE_PRIVATE_IP }}
          BROKER_PRIVATE_IP: ${{ env.BROKER_PRIVATE_IP }}
          CORE_PRIVATE_IP: ${{ env.CORE_PRIVATE_IP }}
          COMPUTE_PRIVATE_IP: ${{ env.COMPUTE_PRIVATE_IP }}
          SECURITY_PRIVATE_IP: ${{ env.SECURITY_PRIVATE_IP }}
          INTELLIGENCE_PRIVATE_IP: ${{ env.INTELLIGENCE_PRIVATE_IP }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          cat << 'EOF' > deploy.sh
          #!/bin/bash
          # Use the environment variables that we will export before running
          
          # Setup SSH key for ubuntu user
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf "Host *\n  StrictHostKeyChecking no\n  ConnectTimeout 5\n" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          
          ALL_IPS="$DATABASE_PRIVATE_IP $BROKER_PRIVATE_IP $CORE_PRIVATE_IP $COMPUTE_PRIVATE_IP $SECURITY_PRIVATE_IP $INTELLIGENCE_PRIVATE_IP"
          
          for IP in $ALL_IPS; do
            if [ -n "$IP" ]; then
              ssh-keyscan -T 5 -H $IP >> ~/.ssh/known_hosts 2>/dev/null
            fi
          done

          echo "$GITHUB_TOKEN" | sudo docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
          
          # Export variables for docker-compose
          export DB_PASSWORD="$DB_PASSWORD"
          export NEXT_PUBLIC_API_URL="http://$EDGE_PUBLIC_IP:3000"
          export JWT_SECRET="qa-secret-key-123"
          export JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY"
          export JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY"
          export MONGO_URI="mongodb://admin:admin@${DATABASE_PRIVATE_IP}:27017/documents?authSource=admin"
          export DATABASE_PRIVATE_IP="$DATABASE_PRIVATE_IP"
          export BROKER_PRIVATE_IP="$BROKER_PRIVATE_IP"
          export CORE_PRIVATE_IP="$CORE_PRIVATE_IP"
          export COMPUTE_PRIVATE_IP="$COMPUTE_PRIVATE_IP"
          export SECURITY_PRIVATE_IP="$SECURITY_PRIVATE_IP"
          export INTELLIGENCE_PRIVATE_IP="$INTELLIGENCE_PRIVATE_IP"
          export S3_BUCKET_NAME="$S3_BUCKET_NAME"
          export AES_SECRET_KEY="$AES_SECRET_KEY"
          export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          export AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN"
          
          mkdir -p keys
          echo "$JWT_PRIVATE_KEY" > keys/private.pem
          echo "$JWT_PUBLIC_KEY" > keys/public.pem
          
          curl -sSL "https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-$(uname -s)-$(uname -m)" -o /tmp/docker-compose
          sudo mv /tmp/docker-compose /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
          
          # Ensure Docker is installed on all private nodes
          for IP in $ALL_IPS; do
            if [ -z "$IP" ]; then continue; fi
            echo "Checking connection to $IP..."
            if ! ssh -o ConnectTimeout=5 ubuntu@$IP "exit" 2>/dev/null; then
              echo "WARNING: Node $IP is unreachable. Skipping."
              continue
            fi
            sudo ssh ubuntu@$IP "command -v docker >/dev/null 2>&1 || (sudo DEBIAN_FRONTEND=noninteractive apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=\"--force-confdef\" -o Dpkg::Options::=\"--force-confold\" docker.io docker-compose && sudo systemctl start docker && sudo systemctl enable docker)"
            sudo ssh ubuntu@$IP "sudo usermod -aG docker ubuntu"
            sudo ssh ubuntu@$IP "sudo docker rm -f \$(sudo docker ps -aq) 2>/dev/null || true"
          done
          
          # 1. Database Node
          sudo ssh ubuntu@$DATABASE_PRIVATE_IP "mkdir -p scripts"
          sudo scp -r scripts/* ubuntu@$DATABASE_PRIVATE_IP:~/scripts/
          sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$DATABASE_PRIVATE_IP -f deployment/compose/database.yml pull
          sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$DATABASE_PRIVATE_IP -f deployment/compose/database.yml up -d
          
          # 2. Broker Node
          sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$BROKER_PRIVATE_IP -f deployment/compose/broker.yml pull
          sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$BROKER_PRIVATE_IP -f deployment/compose/broker.yml up -d
          
          sleep 10
          
          # 3. Security Node
          if [ -n "$SECURITY_PRIVATE_IP" ]; then
            sudo ssh ubuntu@$SECURITY_PRIVATE_IP "mkdir -p deployment/compose/keys"
            sudo scp keys/*.pem ubuntu@$SECURITY_PRIVATE_IP:~/deployment/compose/keys/
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$SECURITY_PRIVATE_IP -f deployment/compose/security.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$SECURITY_PRIVATE_IP -f deployment/compose/security.yml up -d
          fi
          
          # 4. Core Node
          if [ -n "$CORE_PRIVATE_IP" ]; then
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$CORE_PRIVATE_IP -f deployment/compose/core.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$CORE_PRIVATE_IP -f deployment/compose/core.yml up -d
          fi
          
          # 5. Compute Node
          if [ -n "$COMPUTE_PRIVATE_IP" ]; then
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$COMPUTE_PRIVATE_IP -f deployment/compose/compute.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$COMPUTE_PRIVATE_IP -f deployment/compose/compute.yml up -d
          fi
          
          # 6. Intelligence Node
          if [ -n "$INTELLIGENCE_PRIVATE_IP" ]; then
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$INTELLIGENCE_PRIVATE_IP -f deployment/compose/intelligence.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$INTELLIGENCE_PRIVATE_IP -f deployment/compose/intelligence.yml up -d
          fi
          
          # 7. Edge Node (Run Locally on Bastion)
          sudo -E /usr/local/bin/docker-compose -f deployment/compose/edge.yml pull
          sudo -E /usr/local/bin/docker-compose -f deployment/compose/edge.yml up -d
          
          sleep 15
          
          sudo docker run --rm --network host -v /home/ubuntu/scripts:/scripts \
            -e DB_HOST=$DATABASE_PRIVATE_IP \
            -e REDIS_HOST=$DATABASE_PRIVATE_IP \
            -e DB_USER=postgres \
            -e DB_PASSWORD=$DB_PASSWORD \
            -e DB_NAME=identitydb \
            -e API_GATEWAY="http://$EDGE_PUBLIC_IP:3000" \
            node:20-alpine sh -c "cd /scripts && npm install pg ioredis uuid bcryptjs && node global-seed.js"
          EOF
          
          chmod +x deploy.sh
          scp -v -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa deploy.sh ubuntu@${{ env.EDGE_DYNAMIC_IP }}:/home/ubuntu/deploy.sh
          
          cat << 'EOF' > wrapper.sh
          #!/bin/bash
          # Wrapper to run deploy.sh with environment variables securely passed
          export SSH_KEY="$(cat ~/.ssh/id_rsa)"
          
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ubuntu@${{ env.EDGE_DYNAMIC_IP }} << INNER_EOF
            export SSH_KEY="$SSH_KEY"
            export JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY"
            export JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY"
            export DB_PASSWORD="$DB_PASSWORD"
            export GITHUB_TOKEN="$GITHUB_TOKEN"
            export GITHUB_ACTOR="$GITHUB_ACTOR"
            export DATABASE_PRIVATE_IP="$DATABASE_PRIVATE_IP"
            export BROKER_PRIVATE_IP="$BROKER_PRIVATE_IP"
            export CORE_PRIVATE_IP="$CORE_PRIVATE_IP"
            export COMPUTE_PRIVATE_IP="$COMPUTE_PRIVATE_IP"
            export SECURITY_PRIVATE_IP="$SECURITY_PRIVATE_IP"
            export INTELLIGENCE_PRIVATE_IP="$INTELLIGENCE_PRIVATE_IP"
            export EDGE_PUBLIC_IP="${{ secrets.EDGE_PUBLIC_IP }}"
            export MONGO_URI="$MONGO_URI"
            export S3_BUCKET_NAME="$S3_BUCKET_NAME"
            export AES_SECRET_KEY="$AES_SECRET_KEY"
            export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            export AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN"
            
            bash /home/ubuntu/deploy.sh
          INNER_EOF
          EOF
          
          chmod +x wrapper.sh
          ./wrapper.sh



  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'staging') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging')
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Get Terraform Outputs (STAGING)
        id: tf-outputs
        working-directory: infrastructure/terraform/environments/staging
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="scholarship-tf-state-${AWS_ACCOUNT_ID}"
          terraform init -input=false -backend-config="bucket=${BUCKET_NAME}" -backend-config="key=staging/terraform.tfstate" -backend-config="region=us-east-1"
          echo "DATABASE_PRIVATE_IP=$(terraform output -raw database_private_ip)" >> $GITHUB_ENV
          echo "BROKER_PRIVATE_IP=$(terraform output -raw broker_private_ip)" >> $GITHUB_ENV
          echo "BASTION_PUBLIC_IP=$(terraform output -raw bastion_public_ip)" >> $GITHUB_ENV
          echo "ASG_NAME=$(terraform output -raw asg_name)" >> $GITHUB_ENV
          echo "ALB_DNS_NAME=$(terraform output -raw alb_dns_name)" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}" >> $GITHUB_ENV

      - name: Get ASG Instance IPs
        id: asg-ips
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names ${{ env.ASG_NAME }} --query "AutoScalingGroups[0].Instances[*].InstanceId" --output text)
          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "No instances found in ASG"
            EDGE_IPS=""
          else
            EDGE_IPS=$(aws ec2 describe-instances --instance-ids $INSTANCE_IDS --query "Reservations[*].Instances[*].PrivateIpAddress" --output text | tr '\n' ' ' | tr '\t' ' ')
          fi
          echo "EDGE_PRIVATE_IPS=$EDGE_IPS" >> $GITHUB_ENV
          
      - name: Copy docker-compose files to Bastion
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.BASTION_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deployment/compose/,scripts/"
          target: "~/"
          
      - name: Deploy via Bastion Host
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DATABASE_PRIVATE_IP: ${{ env.DATABASE_PRIVATE_IP }}
          BROKER_PRIVATE_IP: ${{ env.BROKER_PRIVATE_IP }}
          EDGE_PRIVATE_IPS: ${{ env.EDGE_PRIVATE_IPS }}
          ALB_DNS_NAME: ${{ env.ALB_DNS_NAME }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ env.BASTION_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD,JWT_PRIVATE_KEY,JWT_PUBLIC_KEY,SSH_KEY,DATABASE_PRIVATE_IP,BROKER_PRIVATE_IP,EDGE_PRIVATE_IPS,ALB_DNS_NAME,MONGO_URI,S3_BUCKET_NAME,AES_SECRET_KEY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_ACCOUNT_ID
          script: |
            # Setup SSH key for ubuntu user
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            printf "Host *\n  StrictHostKeyChecking no\n  ConnectTimeout 5\n" > ~/.ssh/config
            chmod 600 ~/.ssh/config
            ssh-keyscan -H $DATABASE_PRIVATE_IP >> ~/.ssh/known_hosts 2>/dev/null
            ssh-keyscan -H $BROKER_PRIVATE_IP >> ~/.ssh/known_hosts 2>/dev/null
            for IP in $EDGE_PRIVATE_IPS; do
              ssh-keyscan -H $IP >> ~/.ssh/known_hosts 2>/dev/null
            done
            
            # Setup SSH key for root user
            sudo mkdir -p /root/.ssh
            echo "$SSH_KEY" | sudo tee /root/.ssh/id_rsa > /dev/null
            sudo chmod 600 /root/.ssh/id_rsa
            sudo sh -c 'printf "Host *\n  StrictHostKeyChecking no\n  ConnectTimeout 5\n" > /root/.ssh/config'
            sudo chmod 600 /root/.ssh/config
            sudo ssh-keyscan -H $DATABASE_PRIVATE_IP | sudo tee -a /root/.ssh/known_hosts > /dev/null
            sudo ssh-keyscan -H $BROKER_PRIVATE_IP | sudo tee -a /root/.ssh/known_hosts > /dev/null
            for IP in $EDGE_PRIVATE_IPS; do
              sudo ssh-keyscan -H $IP | sudo tee -a /root/.ssh/known_hosts > /dev/null
            done
            
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export NEXT_PUBLIC_API_URL=http://$ALB_DNS_NAME:3000
            export JWT_SECRET=staging-secret-key-123
            export JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY"
            export JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY"
            export MONGO_URI="$MONGO_URI"
            export DATABASE_PRIVATE_IP="$DATABASE_PRIVATE_IP"
            export BROKER_PRIVATE_IP="$BROKER_PRIVATE_IP"
            export S3_BUCKET_NAME="uce-distribuida-staging-documents-${AWS_ACCOUNT_ID}"
            
            export AES_SECRET_KEY="$AES_SECRET_KEY"
            export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            export AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN"
            
            mkdir -p keys
            echo "$JWT_PRIVATE_KEY" > keys/private.pem
            echo "$JWT_PUBLIC_KEY" > keys/public.pem
            
            command -v docker >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y docker.io)
            
            curl -sSL "https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-$(uname -s)-$(uname -m)" -o /tmp/docker-compose
            sudo mv /tmp/docker-compose /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
            
            # Ensure Docker is installed on ALL private nodes (including Broker and Compute)
            for IP in $DATABASE_PRIVATE_IP $BROKER_PRIVATE_IP $EDGE_PRIVATE_IPS; do
              echo "Checking connection to $IP..."
              if ! ssh -o ConnectTimeout=5 ubuntu@$IP "exit" 2>/dev/null; then
                echo "WARNING: Node $IP is unreachable. Skipping."
                continue
              fi
              sudo ssh ubuntu@$IP "command -v docker >/dev/null 2>&1 || (sudo DEBIAN_FRONTEND=noninteractive apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=\"--force-confdef\" -o Dpkg::Options::=\"--force-confold\" docker.io docker-compose && sudo systemctl start docker && sudo systemctl enable docker)"
              sudo ssh ubuntu@$IP "sudo usermod -aG docker ubuntu"
            done
            
            # Database Node
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$DATABASE_PRIVATE_IP -f deployment/compose/database.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$DATABASE_PRIVATE_IP -f deployment/compose/database.yml up -d
            
            # Broker Node (Kafka + Zookeeper + RabbitMQ)
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$BROKER_PRIVATE_IP -f deployment/compose/broker.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$BROKER_PRIVATE_IP -f deployment/compose/broker.yml up -d
            
            # Edge Nodes (ASG - API Gateway + Student Portal)
            for IP in $EDGE_PRIVATE_IPS; do
              echo "Checking connection to Edge $IP..."
              if ! ssh -o ConnectTimeout=5 ubuntu@$IP "exit" 2>/dev/null; then
                echo "WARNING: Edge Node $IP is unreachable. Skipping."
                continue
              fi
              sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$IP -f deployment/compose/edge.yml pull
              sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$IP -f deployment/compose/edge.yml up -d
            done
            
            # Auto-Seed Databases (Identity & Academic)
            
            # Copy scripts to database node for seeding
            sudo ssh -o StrictHostKeyChecking=no ubuntu@$DATABASE_PRIVATE_IP "mkdir -p scripts"
            sudo scp -o StrictHostKeyChecking=no -r scripts/* ubuntu@$DATABASE_PRIVATE_IP:~/scripts/

            echo "Waiting for services to be ready before seeding..."
            sleep 15
            echo "Running Global Seeder inside Node container on Database node..."
            sudo ssh -o StrictHostKeyChecking=no ubuntu@$DATABASE_PRIVATE_IP "sudo docker run --rm --network host -v /home/ubuntu/scripts:/scripts -e DB_HOST=$DATABASE_PRIVATE_IP -e REDIS_HOST=$DATABASE_PRIVATE_IP -e DB_USER=postgres -e DB_PASSWORD=$DB_PASSWORD -e DB_NAME=identitydb -e API_GATEWAY=http://$ALB_DNS_NAME:3000 node:20-alpine sh -c \"cd /scripts && npm install pg ioredis uuid bcryptjs && node global-seed.js\""

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Get Terraform Outputs (PROD)
        id: tf-outputs
        working-directory: infrastructure/terraform/environments/prod
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="scholarship-tf-state-${AWS_ACCOUNT_ID}"
          terraform init -input=false -backend-config="bucket=${BUCKET_NAME}" -backend-config="key=prod/terraform.tfstate" -backend-config="region=us-east-1"
          echo "DATABASE_PRIVATE_IP=$(terraform output -raw database_private_ip)" >> $GITHUB_ENV
          echo "BASTION_PUBLIC_IP=$(terraform output -raw bastion_public_ip)" >> $GITHUB_ENV
          echo "ASG_NAME=$(terraform output -raw asg_name)" >> $GITHUB_ENV
          echo "ALB_DNS_NAME=$(terraform output -raw alb_dns_name)" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}" >> $GITHUB_ENV

      - name: Get ASG Instance IPs
        id: asg-ips
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names ${{ env.ASG_NAME }} --query "AutoScalingGroups[0].Instances[*].InstanceId" --output text)
          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "No instances found in ASG"
            EDGE_IPS=""
          else
            EDGE_IPS=$(aws ec2 describe-instances --instance-ids $INSTANCE_IDS --query "Reservations[*].Instances[*].PrivateIpAddress" --output text | tr '\n' ' ' | tr '\t' ' ')
          fi
          echo "EDGE_PRIVATE_IPS=$EDGE_IPS" >> $GITHUB_ENV
          
      - name: Copy docker-compose files to Bastion
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.BASTION_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deployment/compose/,scripts/"
          target: "~/"
          
      - name: Deploy via Bastion Host
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DATABASE_PRIVATE_IP: ${{ env.DATABASE_PRIVATE_IP }}
          BROKER_PRIVATE_IP: ${{ env.BROKER_PRIVATE_IP }}
          EDGE_PRIVATE_IPS: ${{ env.EDGE_PRIVATE_IPS }}
          ALB_DNS_NAME: ${{ env.ALB_DNS_NAME }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ env.BASTION_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD,JWT_PRIVATE_KEY,JWT_PUBLIC_KEY,SSH_KEY,DATABASE_PRIVATE_IP,BROKER_PRIVATE_IP,EDGE_PRIVATE_IPS,ALB_DNS_NAME,MONGO_URI,S3_BUCKET_NAME,AES_SECRET_KEY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_ACCOUNT_ID
          script: |
            # Setup SSH key for ubuntu user
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            printf "Host *\n  StrictHostKeyChecking no\n  ConnectTimeout 5\n" > ~/.ssh/config
            chmod 600 ~/.ssh/config
            ssh-keyscan -H $DATABASE_PRIVATE_IP >> ~/.ssh/known_hosts 2>/dev/null
            for IP in $EDGE_PRIVATE_IPS; do
              ssh-keyscan -H $IP >> ~/.ssh/known_hosts 2>/dev/null
            done
            
            # Setup SSH key for root user
            sudo mkdir -p /root/.ssh
            echo "$SSH_KEY" | sudo tee /root/.ssh/id_rsa > /dev/null
            sudo chmod 600 /root/.ssh/id_rsa
            sudo sh -c 'printf "Host *\n  StrictHostKeyChecking no\n  ConnectTimeout 5\n" > /root/.ssh/config'
            sudo chmod 600 /root/.ssh/config
            sudo ssh-keyscan -H $DATABASE_PRIVATE_IP | sudo tee -a /root/.ssh/known_hosts > /dev/null
            for IP in $EDGE_PRIVATE_IPS; do
              sudo ssh-keyscan -H $IP | sudo tee -a /root/.ssh/known_hosts > /dev/null
            done
            
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export NEXT_PUBLIC_API_URL=http://$ALB_DNS_NAME:3000
            export JWT_SECRET=prod-secret-key-123
            export JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY"
            export JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY"
            export MONGO_URI="$MONGO_URI"
            export DATABASE_PRIVATE_IP="$DATABASE_PRIVATE_IP"
            export BROKER_PRIVATE_IP="$BROKER_PRIVATE_IP"
            export S3_BUCKET_NAME="uce-distribuida-prod-documents-${AWS_ACCOUNT_ID}"
            
            export AES_SECRET_KEY="$AES_SECRET_KEY"
            export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            export AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN"
            
            mkdir -p keys
            echo "$JWT_PRIVATE_KEY" > keys/private.pem
            echo "$JWT_PUBLIC_KEY" > keys/public.pem
            
            command -v docker >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y docker.io)
            
            curl -sSL "https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-$(uname -s)-$(uname -m)" -o /tmp/docker-compose
            sudo mv /tmp/docker-compose /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
            
            # Ensure Docker is installed on private nodes
            for IP in $DATABASE_PRIVATE_IP $EDGE_PRIVATE_IPS; do
              echo "Checking connection to $IP..."
              if ! ssh -o ConnectTimeout=5 ubuntu@$IP "exit" 2>/dev/null; then
                echo "WARNING: Node $IP is unreachable. Skipping."
                continue
              fi
              sudo ssh ubuntu@$IP "command -v docker >/dev/null 2>&1 || (sudo DEBIAN_FRONTEND=noninteractive apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=\"--force-confdef\" -o Dpkg::Options::=\"--force-confold\" docker.io docker-compose && sudo systemctl start docker && sudo systemctl enable docker)"
              sudo ssh ubuntu@$IP "sudo usermod -aG docker ubuntu"
            done
            
            # Database Node
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$DATABASE_PRIVATE_IP -f deployment/compose/database.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$DATABASE_PRIVATE_IP -f deployment/compose/database.yml up -d
            
            
            # Edge Nodes (ASG)
            for IP in $EDGE_PRIVATE_IPS; do
              echo "Checking connection to Edge $IP..."
              if ! ssh -o ConnectTimeout=5 ubuntu@$IP "exit" 2>/dev/null; then
                echo "WARNING: Edge Node $IP is unreachable. Skipping."
                continue
              fi
              sudo ssh ubuntu@$IP "mkdir -p deployment/compose/keys"
              sudo scp keys/*.pem ubuntu@$IP:~/deployment/compose/keys/
              sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$IP -f deployment/compose/edge.yml pull
              sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$IP -f deployment/compose/edge.yml up -d
            done
            
            # Auto-Seed Databases (Identity & Academic)
            
            # Copy scripts to database node for seeding
            sudo ssh -o StrictHostKeyChecking=no ubuntu@$DATABASE_PRIVATE_IP "mkdir -p scripts"
            sudo scp -o StrictHostKeyChecking=no -r scripts/* ubuntu@$DATABASE_PRIVATE_IP:~/scripts/

            echo "Waiting for services to be ready before seeding..."
            sleep 15
            echo "Running Global Seeder inside Node container on Database node..."
            sudo ssh -o StrictHostKeyChecking=no ubuntu@$DATABASE_PRIVATE_IP "sudo docker run --rm --network host -v /home/ubuntu/scripts:/scripts -e DB_HOST=$DATABASE_PRIVATE_IP -e REDIS_HOST=$DATABASE_PRIVATE_IP -e DB_USER=postgres -e DB_PASSWORD=$DB_PASSWORD -e DB_NAME=identitydb -e API_GATEWAY=http://$ALB_DNS_NAME:3000 node:20-alpine sh -c \"cd /scripts && npm install pg ioredis uuid bcryptjs && node global-seed.js\""

  load-test:
    name: K6 Load Testing
    needs: deploy-qa
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'QA') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'QA')
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        env:
          API_URL: http://${{ secrets.EDGE_PUBLIC_IP }}:3000
        with:
          filename: infrastructure/testing/load/k6-script.js
          flags: --vus 500 --duration 60s
