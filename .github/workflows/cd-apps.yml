            done
            
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export NEXT_PUBLIC_API_URL=http://$ALB_DNS_NAME:3000
            export JWT_SECRET=staging-secret-key-123
            export JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY"
            export JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY"
            export MONGO_URI="$MONGO_URI"
            
            export S3_BUCKET_NAME="uce-distribuida-staging-documents-${AWS_ACCOUNT_ID}"
            
            export AES_SECRET_KEY="$AES_SECRET_KEY"
            export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            export AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN"
            
            mkdir -p keys
            echo "$JWT_PRIVATE_KEY" > keys/private.pem
            echo "$JWT_PUBLIC_KEY" > keys/public.pem
            
            command -v docker >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y docker.io)
            
            curl -sSL "https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-$(uname -s)-$(uname -m)" -o /tmp/docker-compose
            sudo mv /tmp/docker-compose /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
            
            # Ensure Docker is installed on private nodes
            for IP in $DATABASE_PRIVATE_IP $SECURITY_PRIVATE_IP $CORE_PRIVATE_IP $EDGE_PRIVATE_IPS; do
              sudo ssh -o StrictHostKeyChecking=no ubuntu@$IP "command -v docker >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y docker.io docker-compose && sudo systemctl start docker && sudo systemctl enable docker && sudo usermod -aG docker ubuntu)"
            done
            
            # Database Node
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$DATABASE_PRIVATE_IP -f deployment/compose/database.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$DATABASE_PRIVATE_IP -f deployment/compose/database.yml up -d
            
            # Core Node
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$CORE_PRIVATE_IP -f deployment/compose/core.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$CORE_PRIVATE_IP -f deployment/compose/core.yml up -d
            
            # Security Node (needs keys)
            sudo ssh ubuntu@$SECURITY_PRIVATE_IP "mkdir -p deployment/compose/keys"
            sudo scp keys/*.pem ubuntu@$SECURITY_PRIVATE_IP:~/deployment/compose/keys/
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$SECURITY_PRIVATE_IP -f deployment/compose/security.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$SECURITY_PRIVATE_IP -f deployment/compose/security.yml up -d
            
            # Edge Nodes (ASG)
            for IP in $EDGE_PRIVATE_IPS; do
              sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$IP -f deployment/compose/edge.yml pull
              sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$IP -f deployment/compose/edge.yml up -d
            done
            
            # Auto-Seed Databases (Identity & Academic)
            echo "Waiting for services to be ready before seeding..."
            sleep 15
            echo "Running Global Seeder inside Node container on Core node..."
            sudo scp -o StrictHostKeyChecking=no -r ~/scripts ubuntu@$CORE_PRIVATE_IP:~/scripts
            sudo ssh -o StrictHostKeyChecking=no ubuntu@$CORE_PRIVATE_IP "sudo docker run --rm --network host -v /home/ubuntu/scripts:/scripts -e DB_HOST=$DATABASE_PRIVATE_IP -e REDIS_HOST=$DATABASE_PRIVATE_IP -e DB_USER=postgres -e DB_PASSWORD=$DB_PASSWORD -e DB_NAME=identitydb -e API_GATEWAY=http://$ALB_DNS_NAME:3000 node:20-alpine sh -c \"cd /scripts && npm install pg ioredis uuid bcryptjs && node global-seed.js\""

