name: CD Microservices (Docker & Testing)

on:
  workflow_dispatch:
  push:
    branches: [ "QA", "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, identity-service]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/jessielch/scholarship-system-platform/${{ matrix.service }}
          tags: |
            type=raw,value=latest
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Edge EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EDGE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest images
            sudo docker pull ghcr.io/jessielch/scholarship-system-platform/identity-service:latest
            sudo docker pull ghcr.io/jessielch/scholarship-system-platform/api-gateway:latest
            
            # Deploy Redis
            sudo docker rm -f redis || true
            sudo docker run -d --name redis -p 6379:6379 redis:alpine
            
            # Deploy Postgres
            sudo docker rm -f postgres || true
            sudo docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }} -e POSTGRES_DB=identitydbqa -e POSTGRES_USER=postgres postgres:15-alpine
            
            # Wait for Postgres to be ready
            sleep 10
            
            # Deploy Identity Service
            sudo docker rm -f identity-service || true
            sudo docker run -d --name identity-service -p 3001:3001 \
              -e DB_HOST=172.17.0.1 \
              -e DB_PORT=5432 \
              -e DB_USERNAME=postgres \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=identitydbqa \
              ghcr.io/jessielch/scholarship-system-platform/identity-service:latest
              
            # Deploy API Gateway
            sudo docker rm -f api-gateway || true
            sudo docker run -d --name api-gateway -p 3000:3000 \
              -e REDIS_URL=redis://172.17.0.1:6379 \
              -e IDENTITY_SERVICE_URL=http://172.17.0.1:3001 \
              ghcr.io/jessielch/scholarship-system-platform/api-gateway:latest

  load-test:
    name: K6 Load Testing
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/QA'
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: infrastructure/testing/load/k6-script.js
          flags: --vus 10 --duration 5s
