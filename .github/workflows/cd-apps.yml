name: CD Microservices (Docker & Testing)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: ["QA", "main"]

jobs:
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    environment: qa
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/QA') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'QA') }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy docker-compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EDGE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/"
          
      - name: Deploy to QA Edge EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        with:
          host: ${{ secrets.EDGE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_PRIVATE_KEY,JWT_PUBLIC_KEY
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            cat << 'EOF' > .env
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            NEXT_PUBLIC_API_URL=http://${{ secrets.EDGE_PUBLIC_IP }}:3000
            JWT_SECRET=qa-secret-key-123
            EOF
            
            mkdir -p keys
            echo "$JWT_PRIVATE_KEY" > keys/private.pem
            echo "$JWT_PUBLIC_KEY" > keys/public.pem
            
            # Use docker-compose for declarative, intelligent deployment
            sudo docker-compose -f docker-compose.prod.yml pull
            sudo docker-compose -f docker-compose.prod.yml up -d
            
            # Clean up old unused apps
            sudo docker rm -f web-portal || true
            sudo docker system prune -af

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy docker-compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EDGE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/"
          
      - name: Deploy to PROD Edge EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        with:
          host: ${{ secrets.EDGE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_PRIVATE_KEY,JWT_PUBLIC_KEY
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            cat << 'EOF' > .env
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            NEXT_PUBLIC_API_URL=http://${{ secrets.EDGE_PUBLIC_IP }}:3000
            JWT_SECRET=prod-secret-key-123
            EOF
            
            mkdir -p keys
            echo "$JWT_PRIVATE_KEY" > keys/private.pem
            echo "$JWT_PUBLIC_KEY" > keys/public.pem
            
            # Use docker-compose for declarative, intelligent deployment
            sudo docker-compose -f docker-compose.prod.yml pull
            sudo docker-compose -f docker-compose.prod.yml up -d
            
            # Clean up old unused apps
            sudo docker rm -f web-portal || true
            sudo docker system prune -af

  load-test:
    name: K6 Load Testing
    needs: deploy-qa
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/QA') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'QA') }}
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        env:
          API_URL: http://${{ secrets.EDGE_PUBLIC_IP }}:3000
        with:
          filename: infrastructure/testing/load/k6-script.js
          flags: --vus 10 --duration 5s
