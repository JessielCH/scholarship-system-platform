            sudo scp keys/*.pem ubuntu@$SECURITY_PRIVATE_IP:~/deployment/compose/keys/
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$SECURITY_PRIVATE_IP -f deployment/compose/security.yml pull
            sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$SECURITY_PRIVATE_IP -f deployment/compose/security.yml up -d
            
            # Edge Nodes (ASG)
            for IP in $EDGE_PRIVATE_IPS; do
              sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$IP -f deployment/compose/edge.yml pull
              sudo -E /usr/local/bin/docker-compose -H ssh://ubuntu@$IP -f deployment/compose/edge.yml up -d
            done
            
            # Auto-Seed Databases (Identity & Academic)
            echo "Waiting for services to be ready before seeding..."
            sleep 15
            echo "Running Global Seeder inside Node container on Core node..."
            sudo scp -o StrictHostKeyChecking=no -r ~/scripts ubuntu@$CORE_PRIVATE_IP:~/scripts
            sudo ssh -o StrictHostKeyChecking=no ubuntu@$CORE_PRIVATE_IP "sudo docker run --rm --network host -v /home/ubuntu/scripts:/scripts -e DB_HOST=$DATABASE_PRIVATE_IP -e REDIS_HOST=$DATABASE_PRIVATE_IP -e DB_USER=postgres -e DB_PASSWORD=$DB_PASSWORD -e DB_NAME=identitydb -e API_GATEWAY=http://$ALB_DNS_NAME:3000 node:20-alpine sh -c \"cd /scripts && npm install pg ioredis uuid bcryptjs && node global-seed.js\""

  load-test:
    name: K6 Load Testing
    needs: deploy-qa
    runs-on: ubuntu-latest
    if: github.ref_name == 'QA'
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        env:
          API_URL: http://${{ secrets.EDGE_PUBLIC_IP }}:3000
        with:
          filename: infrastructure/testing/load/k6-script.js
          flags: --vus 500 --duration 60s
