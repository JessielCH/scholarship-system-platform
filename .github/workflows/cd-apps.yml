name: CD Microservices (Docker & Testing)

on:
  workflow_dispatch:
  push:
    branches: [ "QA", "main" ]

jobs:
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    environment: qa
    if: github.ref == 'refs/heads/QA'
    steps:
      - name: Deploy to QA Edge EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        with:
          host: ${{ secrets.EDGE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_PRIVATE_KEY,JWT_PUBLIC_KEY
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Create isolated env file for QA
            cat << 'EOF' > .env.qa
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            EOF
            
            # Create keys directory and files
            mkdir -p keys
            echo "$JWT_PRIVATE_KEY" > keys/private.pem
            echo "$JWT_PUBLIC_KEY" > keys/public.pem
            
            sudo docker pull ghcr.io/jessielch/scholarship-system-platform/identity-service:latest
            sudo docker pull ghcr.io/jessielch/scholarship-system-platform/api-gateway:latest
            sudo docker pull ghcr.io/jessielch/scholarship-system-platform/student-portal:latest
            
            sudo docker network create micro-net || true
            
            sudo docker rm -f redis || true
            sudo docker run -d --name redis --network micro-net --restart unless-stopped -p 6379:6379 redis:alpine
            
            sudo docker rm -f postgres || true
            sudo docker run -d --name postgres --network micro-net --restart unless-stopped -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }} -e POSTGRES_DB=${{ secrets.DB_NAME }} postgres:15-alpine
            
            sleep 15
            
            sudo docker rm -f identity-service || true
            sudo docker run -d --name identity-service --network micro-net --restart unless-stopped -v $(pwd)/keys:/app/keys -p 3001:3001 --env-file .env.qa -e PORT=3001 -e DB_HOST=postgres -e DB_PORT=5432 -e DB_USERNAME=postgres ghcr.io/jessielch/scholarship-system-platform/identity-service:latest
              
            sudo docker rm -f api-gateway || true
            sudo docker run -d --name api-gateway --network micro-net --restart unless-stopped -v $(pwd)/keys:/app/keys -p 3000:3000 --env-file .env.qa -e PORT=3000 -e REDIS_URL=redis://redis:6379 -e IDENTITY_SERVICE_URL=http://identity-service:3001 ghcr.io/jessielch/scholarship-system-platform/api-gateway:latest
            
            sudo docker rm -f student-portal || true
            sudo docker run -d --name student-portal --network micro-net --restart unless-stopped -p 3002:3000 -e NEXT_PUBLIC_API_URL=http://${{ secrets.EDGE_PUBLIC_IP }}:3000 ghcr.io/jessielch/scholarship-system-platform/student-portal:latest

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to PROD Edge EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        with:
          host: ${{ secrets.EDGE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_PRIVATE_KEY,JWT_PUBLIC_KEY
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Create isolated env file for PROD
            cat << 'EOF' > .env.prod
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            EOF
            
            # Create keys directory and files
            mkdir -p keys
            echo "$JWT_PRIVATE_KEY" > keys/private.pem
            echo "$JWT_PUBLIC_KEY" > keys/public.pem
            
            sudo docker pull ghcr.io/jessielch/scholarship-system-platform/identity-service:latest
            sudo docker pull ghcr.io/jessielch/scholarship-system-platform/api-gateway:latest
            sudo docker pull ghcr.io/jessielch/scholarship-system-platform/student-portal:latest
            
            sudo docker network create micro-net || true
            
            sudo docker rm -f redis || true
            sudo docker run -d --name redis --network micro-net --restart unless-stopped -p 6379:6379 redis:alpine
            
            sudo docker rm -f postgres || true
            sudo docker run -d --name postgres --network micro-net --restart unless-stopped -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }} -e POSTGRES_DB=${{ secrets.DB_NAME }} postgres:15-alpine
            
            sleep 15
            
            sudo docker rm -f identity-service || true
            sudo docker run -d --name identity-service --network micro-net --restart unless-stopped -v $(pwd)/keys:/app/keys -p 3001:3001 --env-file .env.prod -e PORT=3001 -e DB_HOST=postgres -e DB_PORT=5432 -e DB_USERNAME=postgres ghcr.io/jessielch/scholarship-system-platform/identity-service:latest
              
            sudo docker rm -f api-gateway || true
            sudo docker run -d --name api-gateway --network micro-net --restart unless-stopped -v $(pwd)/keys:/app/keys -p 3000:3000 --env-file .env.prod -e PORT=3000 -e REDIS_URL=redis://redis:6379 -e IDENTITY_SERVICE_URL=http://identity-service:3001 ghcr.io/jessielch/scholarship-system-platform/api-gateway:latest

            sudo docker rm -f student-portal || true
            sudo docker run -d --name student-portal --network micro-net --restart unless-stopped -p 3002:3000 -e NEXT_PUBLIC_API_URL=http://${{ secrets.EDGE_PUBLIC_IP }}:3000 ghcr.io/jessielch/scholarship-system-platform/student-portal:latest

  load-test:
    name: K6 Load Testing
    needs: deploy-qa
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/QA'
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        env:
          API_URL: http://${{ secrets.EDGE_PUBLIC_IP }}:3000
        with:
          filename: infrastructure/testing/load/k6-script.js
          flags: --vus 10 --duration 5s
