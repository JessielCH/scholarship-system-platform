sonar.projectKey=g4-uce-scholarship-system
sonar.projectName=Scholarship System Platform
sonar.organization=jessielch
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Excluimos de la revisión de código los tests y carpetas compiladas
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.ts,**/dist/**,**/build/**

# Propiedad requerida por SonarQube si hay archivos Java (evita que el scan falle si no están compilados)
sonar.java.binaries=.

# Rutas para reportes de cobertura de pruebas unitarias (LCOV) en TypeScript y JavaScript
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
sonar.typescript.lcov.reportPaths=**/coverage/lcov.info
