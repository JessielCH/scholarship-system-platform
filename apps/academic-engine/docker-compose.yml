version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: academic-engine-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  academic-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academic-engine
    ports:
      - "8081:8081"
    environment:
      USE_REDIS: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8081
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
