server:
  port: 8084
spring:
  application:
    name: document-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/documents}
      database: documents
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

aws:
  s3:
    bucket-name: ${S3_BUCKET_NAME:uce-documents-local}
    region: ${AWS_REGION:us-east-1}

encryption:
  aes-key: ${AES_SECRET_KEY}
