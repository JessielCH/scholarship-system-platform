name: scholarship-system

services:
  # Base de Datos en Memoria para Proyecciones CQRS
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - scholarship-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RabbitMQ Broker para Eventos
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - scholarship-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (Entrada principal)
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - IDENTITY_SERVICE_URL=http://identity-service:3001
      - ACADEMIC_SERVICE_URL=http://academic-engine:8081
      - SOCIOECONOMIC_SERVICE_URL=http://socioeconomic-validator:8082
    volumes:
      - ./keys:/app/keys
    networks:
      - scholarship-net
    depends_on:
      - identity-service
      - academic-engine
      - socioeconomic-validator

  # Identity Service (Autenticación JWT)
  identity-service:
    build:
      context: ./apps/identity-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres123!
      - DB_NAME=identity_db
      - NODE_ENV=development
    volumes:
      - ./keys:/app/keys
    networks:
      - scholarship-net
    depends_on:
      postgres:
        condition: service_healthy

  # Backend Go: Motor Académico
  academic-engine:
    build:
      context: ./apps/academic-engine
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - USE_REDIS=true
      - REDIS_URL=redis://redis:6379
      - PORT=8081
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - scholarship-net

  # Frontend Next.js: Portal de Estudiantes
  student-portal:
    build:
      context: ./apps/student-portal
      dockerfile: Dockerfile
      args:
        - API_URL=http://api-gateway:3000
    ports:
      - "80:3000"
    environment:
      - API_URL=http://api-gateway:3000
    networks:
      - scholarship-net
    depends_on:
      - api-gateway

  # Base de datos relacional
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - scholarship-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservicio Validador Socioeconómico
  socioeconomic-validator:
    build:
      context: ./apps/socioeconomic-validator
      dockerfile: Dockerfile
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=socioeconomic_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123!
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scholarship-net

networks:
  scholarship-net:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  rabbitmq_data:
