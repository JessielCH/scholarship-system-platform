name: scholarship-system

services:
  # Base de Datos en Memoria para Proyecciones CQRS
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - scholarship-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend Go: Motor Académico
  academic-engine:
    build:
      context: ./apps/academic-engine
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - USE_REDIS=true
      - REDIS_URL=redis://redis:6379
      - PORT=8081
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - scholarship-net

  # Frontend Next.js: Portal de Estudiantes
  student-portal:
    build:
      context: ./apps/student-portal
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://academic-engine:8081
    networks:
      - scholarship-net
    depends_on:
      - academic-engine

networks:
  scholarship-net:
    driver: bridge

volumes:
  redis_data:
