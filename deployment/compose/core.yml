version: '3.8'
services:
  academic-engine:
    image: ghcr.io/jessielch/scholarship-system-platform/academic-engine:latest
    container_name: scholarship_academic_engine
    restart: unless-stopped
    environment:
      - USE_REDIS=true
      - REDIS_URL=redis://${DATABASE_PRIVATE_IP}:6379
      - PORT=8081
    ports:
      - "8081:8081"

  socioeconomic-validator:
    image: ghcr.io/jessielch/scholarship-system-platform/socioeconomic-validator:latest
    container_name: scholarship_socioeconomic_validator
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=socioeconomic_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8082:8082"
