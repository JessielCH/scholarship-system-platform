version: '3.8'
services:
  api-gateway:
    image: ghcr.io/jessielch/scholarship-system-platform/api-gateway:latest
    container_name: scholarship-gateway
    restart: unless-stopped
    environment:
      - PORT=3000
      - REDIS_URL=redis://${DATABASE_PRIVATE_IP:-redis}:6379
      - IDENTITY_SERVICE_URL=http://scholarship-identity:3001
      - ACADEMIC_SERVICE_URL=http://scholarship-academic-engine:8081
      - DOCUMENT_SERVICE_URL=http://scholarship-document-service:8084
      - SAGA_SERVICE_URL=http://scholarship-workflow-saga:8083
      - SOCIOECONOMIC_SERVICE_URL=http://scholarship-socioeconomic:8082
      - FINANCIAL_SERVICE_URL=http://scholarship-payment-service:3003
      - JWT_SECRET=${JWT_SECRET:-secret}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-public}
    ports:
      - "3000:3000"
    volumes:
      - ./keys:/app/keys

  student-portal:
    image: ghcr.io/jessielch/scholarship-system-platform/student-portal:latest
    container_name: scholarship-student_portal
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_URL=http://scholarship-gateway:3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "80:3000"

  identity-service:
    image: ghcr.io/jessielch/scholarship-system-platform/identity-service:latest
    container_name: scholarship-identity
    restart: unless-stopped
    environment:
      - PORT=3001
      - DB_HOST=${DATABASE_PRIVATE_IP:-postgres}
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres123!}
      - DB_NAME=identitydb
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-secret}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-private}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-public}
    ports:
      - "3001:3001"
    volumes:
      - ./keys:/app/keys

  academic-engine:
    image: ghcr.io/jessielch/scholarship-system-platform/academic-engine:latest
    container_name: scholarship-academic-engine
    restart: unless-stopped
    environment:
      - USE_REDIS=true
      - REDIS_URL=redis://${DATABASE_PRIVATE_IP:-redis}:6379
      - DB_HOST=${DATABASE_PRIVATE_IP:-postgres}
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres123!}
      - DB_NAME=academicdb
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@${BROKER_PRIVATE_IP:-rabbitmq}:5672/
      - PORT=8081
    ports:
      - "8081:8081"

  document-service:
    image: ghcr.io/jessielch/scholarship-system-platform/document-service:latest
    container_name: scholarship-document-service
    restart: unless-stopped
    environment:
      - PORT=8084
      - MONGO_URI=mongodb://admin:admin@${DATABASE_PRIVATE_IP:-mongodb}:27017/documents?authSource=admin
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-uce-distribuida-documents}
      - AES_SECRET_KEY=${AES_SECRET_KEY:-secret}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-mock}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-mock}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-mock}
      - AWS_REGION=us-east-1
      - SPRING_RABBITMQ_HOST=${BROKER_PRIVATE_IP:-rabbitmq}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-admin}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin123}
    ports:
      - "8084:8084"

  workflow-saga:
    image: ghcr.io/jessielch/scholarship-system-platform/workflow-saga:latest
    container_name: scholarship-workflow-saga
    restart: unless-stopped
    environment:
      - REDIS_HOST=${DATABASE_PRIVATE_IP:-redis}
      - REDIS_PORT=6379
      - KAFKA_BROKERS=${BROKER_PRIVATE_IP:-kafka-1}:9092
      - SERVER_PORT=8083
    ports:
      - "8083:8083"

  payment-service:
    image: ghcr.io/jessielch/scholarship-system-platform/payment-service:latest
    container_name: scholarship-payment-service
    restart: unless-stopped
    environment:
      - PORT=3003
      - DB_HOST=${DATABASE_PRIVATE_IP:-mariadb}
      - DB_USER=payment_user
      - DB_PASSWORD=payment_password
      - DB_NAME=payment_db
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_test}
    ports:
      - "3003:3003"

  socioeconomic-validator:
    image: ghcr.io/jessielch/scholarship-system-platform/socioeconomic-validator:latest
    container_name: scholarship-socioeconomic
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DATABASE_PRIVATE_IP:-postgres}:5432/socioeconomic_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres123!}
      - SPRING_REDIS_HOST=${DATABASE_PRIVATE_IP:-redis}
      - SPRING_REDIS_PORT=6379
    ports:
      - "8082:8082"
