version: '3.8'
services:
  api-gateway:
    image: ghcr.io/jessielch/scholarship-system-platform/api-gateway:latest
    container_name: scholarship_gateway
    restart: unless-stopped
    environment:
      - PORT=3000
      - REDIS_URL=redis://${DATABASE_PRIVATE_IP}:6379
      - IDENTITY_SERVICE_URL=http://${SECURITY_PRIVATE_IP}:3001
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - ./keys:/app/keys

  student-portal:
    image: ghcr.io/jessielch/scholarship-system-platform/student-portal:latest
    container_name: scholarship_student_portal
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_URL=http://${CORE_PRIVATE_IP}:8081
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "80:3000"
